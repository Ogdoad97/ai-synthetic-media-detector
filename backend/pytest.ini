[pytest]
# Without this, `from app...` / `from evaluation...` imports in the test
# suite only resolve by accident of whatever else is already on sys.path
# in the environment running pytest - which is how this went unnoticed
# for as long as it did: no config here ever meant the suite had never
# actually been verified to run in a genuinely clean environment before
# this repo's first-ever CI run caught it. pythonpath = . makes it
# explicit and environment-independent instead.
pythonpath = .
